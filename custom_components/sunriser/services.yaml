backup:
  name: Download Backup
  description: >
    Download a complete backup of all device configuration and save it as a
    .msgpack file in your Home Assistant /config directory. Returns the saved
    file path so you can use it with the restore service later.
  fields:
    device_id:
      name: Controller
      description: SunRiser controller. Required when more than one controller is loaded.
      selector:
        device:
          integration: sunriser

restore:
  name: Restore Backup
  description: >
    Restore device configuration from a previously downloaded backup file.
    The device performs a deep restart after applying the config. Use the
    file path returned by the backup service.
  fields:
    device_id:
      name: Controller
      description: SunRiser controller. Required when more than one controller is loaded.
      selector:
        device:
          integration: sunriser
    file_path:
      name: File path
      description: >
        Absolute path to the .msgpack backup file
        Use the path returned by the backup action.
      required: true
      example: /config/REPLACE_WITH_BACKUP_FILENAME.msgpack
      selector:
        text: {}

get_errors:
  name: Get Error Log
  description: >
    Retrieve the device error log. Returns a dict with a "content" key
    containing the raw log text.
  fields:
    device_id:
      name: Controller
      description: SunRiser controller. Required when more than one controller is loaded.
      selector:
        device:
          integration: sunriser

get_log:
  name: Get Diagnostic Log
  description: >
    Retrieve the device diagnostic log. Returns a dict with a "content" key
    containing the raw log text.
  fields:
    device_id:
      name: Controller
      description: SunRiser controller. Required when more than one controller is loaded.
      selector:
        device:
          integration: sunriser

get_dayplanner_schedule:
  name: Get Day Planner Schedule
  description: >
    Read the cached day planner schedule for a PWM channel. Returns "pwm",
    "name", "color_id", and "markers". Each marker has "time" (HH:MM) and
    "percent" (0–100).
  fields:
    device_id:
      name: Controller
      description: SunRiser controller. Required when more than one controller is loaded.
      selector:
        device:
          integration: sunriser
    pwm:
      name: PWM channel
      description: PWM channel number (1–10).
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 10
          mode: box

set_dayplanner_schedule:
  name: Set Day Planner Schedule
  description: >
    Replace the day planner schedule for a PWM channel. The device will follow
    the new schedule from the next minute boundary. Provide at least one marker.
  fields:
    device_id:
      name: Controller
      description: SunRiser controller. Required when more than one controller is loaded.
      selector:
        device:
          integration: sunriser
    pwm:
      name: PWM channel
      description: PWM channel number (1–10).
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 10
          mode: box
    markers:
      name: Markers
      description: >
        List of schedule markers. Each marker needs "time" (HH:MM; 24:00 is
        accepted for end of day) and "percent" (integer, 0–100). The device interpolates linearly between markers.
      required: true
      example:
        - time: "06:00"
          percent: 0
        - time: "08:00"
          percent: 100
        - time: "20:00"
          percent: 100
        - time: "22:00"
          percent: 0
      selector:
        object: {}

get_weekplanner_schedule:
  name: Get Week Planner Schedule
  description: >
    Read the current week planner program assignment for a PWM channel. Returns
    a dict with "pwm", "name", "color_id", and "schedule" keys. The schedule maps
    day names (sunday, monday, …, saturday, default) to program IDs (integers),
    or null for unset assignments. "default" is the fallback program used on days with no explicit assignment.
  fields:
    device_id:
      name: Controller
      description: SunRiser controller. Required when more than one controller is loaded.
      selector:
        device:
          integration: sunriser
    pwm:
      name: PWM channel
      description: PWM channel number (1–10).
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 10
          mode: box

set_weekplanner_schedule:
  name: Set Week Planner Schedule
  description: >
    Write the week planner program assignment for a PWM channel. Provide a
    "schedule" dict mapping day names (sunday, monday, tuesday, wednesday,
    thursday, friday, saturday, default) to program IDs. Omitted days default
    to 0 (no program). "default" is the fallback used on unassigned days.
  fields:
    device_id:
      name: Controller
      description: SunRiser controller. Required when more than one controller is loaded.
      selector:
        device:
          integration: sunriser
    pwm:
      name: PWM channel
      description: PWM channel number (1–10).
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 10
          mode: box
    schedule:
      name: Schedule
      description: >
        Dict mapping day names to program IDs (integers). Include only the days
        you want to set; omitted days are written as 0 (no program).
      required: true
      example:
        monday: 1
        tuesday: 1
        wednesday: 1
        thursday: 1
        friday: 1
        saturday: 2
        sunday: 2
        default: 1
      selector:
        object: {}

download_factory_backup:
  name: Download Factory Backup
  description: >
    Download the configuration preserved by a factory reset, when available, as a
    .msgpack file in your Home Assistant /config directory. Returns the saved
    file path.
  fields:
    device_id:
      name: Controller
      description: SunRiser controller. Required when more than one controller is loaded.
      selector:
        device:
          integration: sunriser

download_firmware:
  name: Download Firmware Info
  description: >
    Download the firmware info blob (GET /firmware.mp) from the device and save
    it as a .msgpack file in /config. Developer/diagnostic use only.
  fields:
    device_id:
      name: Controller
      description: SunRiser controller. Required when more than one controller is loaded.
      selector:
        device:
          integration: sunriser

download_bootload:
  name: Download Bootload Info
  description: >
    Download the bootload info blob (GET /bootload.mp) from the device and save
    it as a .msgpack file in /config. Developer/diagnostic use only.
  fields:
    device_id:
      name: Controller
      description: SunRiser controller. Required when more than one controller is loaded.
      selector:
        device:
          integration: sunriser

factory_reset:
  name: Factory Reset
  description: >
    Reset ALL device configuration to factory defaults (DELETE /). This is
    irreversible — all PWM settings, schedules, and network config will be wiped.
    You must pass confirm: true to proceed.
  fields:
    device_id:
      name: Controller
      description: SunRiser controller. Required when more than one controller is loaded.
      selector:
        device:
          integration: sunriser
    confirm:
      name: Confirm
      description: Must be set to true to execute the reset.
      required: true
      example: true
      selector:
        boolean: {}

get_planning:
  name: Get Planning Snapshot
  description: >
    Read configured channels, named programs, daily curves and weekly assignments
    for the schedule card. Includes revision tokens for conflict-checked editing.
    Weekly curves use the controller timezone and exclude weather/manual overrides.
  fields:
    device_id:
      name: Controller
      description: Required when more than one SunRiser controller is loaded.
      selector:
        device:
          integration: sunriser

save_planning:
  name: Save Planning Draft
  description: >
    Save a daily curve, shared program curve, or full weekly assignment using the
    revision from Get Planning Snapshot. Rejects stale edits. Does not change the
    selected planner or send an immediate output command. Firmware 1.006+ only.
  fields:
    device_id:
      name: Controller
      description: Required when more than one SunRiser controller is loaded.
      selector:
        device:
          integration: sunriser
    kind:
      name: Schedule type
      required: true
      selector:
        select:
          options: [daily, week, program]
    target:
      name: Channel or program ID
      description: PWM channel for daily/week, or existing program ID for program.
      required: true
      selector:
        number:
          min: 1
          mode: box
    revision:
      name: Revision
      description: Copy the relevant revision token from Get Planning Snapshot.
      required: true
      selector:
        text: {}
    markers:
      name: Curve markers
      description: Required for daily/program. Unique HH:MM times (including 24:00) and integer percentages from 0 to 100.
      selector:
        object: {}
    schedule:
      name: Weekly program IDs
      description: Required for week. Eight IDs in Sunday-to-Saturday then fallback order. Zero uses the fallback; zero fallback means no program.
      selector:
        object: {}
