name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    name: Attach sunriser.zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build sunriser.zip
        working-directory: custom_components/sunriser
        run: zip -r "$RUNNER_TEMP/sunriser.zip" . -x "*__pycache__*"
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/sunriser.zip" --clobber
